<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoeWAF 管理界面</title>
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdmirror.com/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/axios@1.4.0/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 20px;
        }
        .card {
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
        }
        .nav-tabs .nav-link.active {
            background-color: #e9ecef;
            border-color: #dee2e6 #dee2e6 #e9ecef;
        }
        .rule-item {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .rule-item:hover {
            background-color: #f8f9fa;
        }
        .rule-content {
            margin-left: 20px;
        }
        .btn-group {
            margin-right: 10px;
        }
        .alert {
            margin-top: 10px;
        }
        #chart-container {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">MoeWAF 管理界面</h1>
        
        <!-- 导航标签 -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="status-tab" data-bs-toggle="tab" data-bs-target="#status" type="button" role="tab" aria-controls="status" aria-selected="true">系统状态</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="rules-tab" data-bs-toggle="tab" data-bs-target="#rules" type="button" role="tab" aria-controls="rules" aria-selected="false">规则管理</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab" aria-controls="config" aria-selected="false">配置管理</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button" role="tab" aria-controls="logs" aria-selected="false">日志设置</button>
            </li>
        </ul>
        
        <!-- 标签内容 -->
        <div class="tab-content" id="mainTabsContent">
            <!-- 系统状态标签 -->
            <div class="tab-pane fade show active" id="status" role="tabpanel" aria-labelledby="status-tab">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">统计数据</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div id="chart-container"></div>
                            </div>
                            <div class="col-md-6">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>项目</th>
                                            <th>数量</th>
                                        </tr>
                                    </thead>
                                    <tbody id="stats-table">
                                        <tr>
                                            <td>请求总数</td>
                                            <td id="req-total">-</td>
                                        </tr>
                                        <tr>
                                            <td>正常请求</td>
                                            <td id="req-normal">-</td>
                                        </tr>
                                        <tr>
                                            <td>攻击请求</td>
                                            <td id="req-attack">-</td>
                                        </tr>
                                        <tr>
                                            <td>白名单IP命中</td>
                                            <td id="req-white-ip">-</td>
                                        </tr>
                                        <tr>
                                            <td>白名单URL命中</td>
                                            <td id="req-white-url">-</td>
                                        </tr>
                                        <tr>
                                            <td>黑名单IP命中</td>
                                            <td id="req-black-ip">-</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 规则管理标签 -->
            <div class="tab-pane fade" id="rules" role="tabpanel" aria-labelledby="rules-tab">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">规则管理</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="rule-file" class="form-label">选择规则文件</label>
                            <select class="form-select" id="rule-file">
                                <option value="system/args.rule">参数规则 (args.rule)</option>
                                <option value="system/cookie.rule">Cookie规则 (cookie.rule)</option>
                                <option value="system/post.rule">POST规则 (post.rule)</option>
                                <option value="system/url.rule">URL规则 (url.rule)</option>
                                <option value="system/useragent.rule">User-Agent规则 (useragent.rule)</option>
                                <option value="system/referer.rule">Referer规则 (referer.rule)</option>
                                <option value="system/header.rule">Header规则 (header.rule)</option>
                                <option value="blackip.rule">黑名单IP (blackip.rule)</option>
                                <option value="whiteip.rule">白名单IP (whiteip.rule)</option>
                                <option value="whiteurl.rule">白名单URL (whiteurl.rule)</option>
                                <option value="useragentforcc.rule">CC白名单User-Agent (useragentforcc.rule)</option>
                            </select>
                        </div>
                        <div id="rule-content">
                            <!-- 规则内容将通过JavaScript加载 -->
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-primary" id="add-rule">添加规则</button>
                            <button class="btn btn-success" id="save-rules">保存规则</button>
                            <div class="alert alert-info mt-3" role="alert">
                                注意：保存规则后需要重启Nginx才能生效
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 配置管理标签 -->
            <div class="tab-pane fade" id="config" role="tabpanel" aria-labelledby="config-tab">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">配置管理</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h6>基础设置</h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-waf-enable">
                                <label class="form-check-label" for="config-waf-enable">
                                    启用WAF
                                </label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <h6>路径设置</h6>
                            <div class="mb-2">
                                <label for="config-log-dir" class="form-label">日志目录</label>
                                <input type="text" class="form-control" id="config-log-dir">
                            </div>
                            <div class="mb-2">
                                <label for="config-rule-dir" class="form-label">规则目录</label>
                                <input type="text" class="form-control" id="config-rule-dir">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <h6>检测开关</h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-header-check">
                                <label class="form-check-label" for="config-header-check">
                                    Header检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-referer-check">
                                <label class="form-check-label" for="config-referer-check">
                                    Referer检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-white-url-check">
                                <label class="form-check-label" for="config-white-url-check">
                                    白名单URL检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-white-ip-check">
                                <label class="form-check-label" for="config-white-ip-check">
                                    白名单IP检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-black-ip-check">
                                <label class="form-check-label" for="config-black-ip-check">
                                    黑名单IP检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-url-check">
                                <label class="form-check-label" for="config-url-check">
                                    URL检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-url-args-check">
                                <label class="form-check-label" for="config-url-args-check">
                                    URL参数检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-user-agent-check">
                                <label class="form-check-label" for="config-user-agent-check">
                                    User-Agent检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-cookie-check">
                                <label class="form-check-label" for="config-cookie-check">
                                    Cookie检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-post-check">
                                <label class="form-check-label" for="config-post-check">
                                    POST检测
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="config-cc-check">
                                <label class="form-check-label" for="config-cc-check">
                                    CC攻击防护
                                </label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <h6>CC防护设置</h6>
                            <div class="mb-2">
                                <label for="config-cc-mode" class="form-label">CC防护模式</label>
                                <select class="form-select" id="config-cc-mode">
                                    <option value="ip">IP模式</option>
                                    <option value="ipurl">IP+URL模式</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label for="config-cc-rate-ip" class="form-label">IP模式限流 (次数/秒数)</label>
                                <input type="text" class="form-control" id="config-cc-rate-ip" placeholder="例如: 1000/600">
                            </div>
                            <div class="mb-2">
                                <label for="config-cc-rate-ipurl" class="form-label">IP+URL模式限流 (次数/秒数)</label>
                                <input type="text" class="form-control" id="config-cc-rate-ipurl" placeholder="例如: 20/60">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <h6>拦截设置</h6>
                            <div class="mb-2">
                                <label for="config-waf-model" class="form-label">拦截模式</label>
                                <select class="form-select" id="config-waf-model">
                                    <option value="reset">重置连接</option>
                                    <option value="redirect">重定向</option>
                                    <option value="html">返回HTML页面</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label for="config-waf-redirect-url" class="form-label">重定向URL</label>
                                <input type="text" class="form-control" id="config-waf-redirect-url">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <h6>安全设置</h6>
                            <div class="mb-2">
                                <label for="config-security-token" class="form-label">安全Token</label>
                                <input type="text" class="form-control" id="config-security-token">
                            </div>
                            <div class="mb-2">
                                <label for="config-security-table" class="form-label">自定义编码表</label>
                                <input type="text" class="form-control" id="config-security-table">
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <button class="btn btn-primary" id="save-config">保存配置</button>
                            <button class="btn btn-warning" id="restart-nginx">重启Nginx</button>
                            <button class="btn btn-secondary" id="reload-config">重新加载配置</button>
                        </div>
                        
                        <div class="alert alert-info mt-3" role="alert">
                            注意：保存配置后需要重启Nginx才能生效。如果无法重启Nginx，请手动重启。
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 日志设置标签 -->
            <div class="tab-pane fade" id="logs" role="tabpanel" aria-labelledby="logs-tab">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">日志设置</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">日志忽略白名单</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="log-whitelist-enabled">
                                <label class="form-check-label" for="log-whitelist-enabled">
                                    启用日志忽略白名单（使用白名单IP和白名单URL规则）
                                </label>
                            </div>
                            <button class="btn btn-primary mt-3" id="save-log-settings">保存设置</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加规则模态框 -->
    <div class="modal fade" id="addRuleModal" tabindex="-1" aria-labelledby="addRuleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addRuleModalLabel">添加规则</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="new-rule" class="form-label">规则内容（正则表达式）</label>
                        <input type="text" class="form-control" id="new-rule" placeholder="例如：\bSELECT\b.*\bFROM\b">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirm-add-rule">添加</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 初始化Bootstrap标签页
        const mainTabs = new bootstrap.Tab(document.getElementById('mainTabs'));
        
        // 初始化图表
        const chart = echarts.init(document.getElementById('chart-container'));
        
        // 获取统计数据
        function getStats() {
            axios.get('/api/stats')
                .then(response => {
                    const data = response.data;
                    
                    // 更新表格数据
                    document.getElementById('req-total').textContent = data.firewall_req_total || 0;
                    document.getElementById('req-normal').textContent = data.firewall_req_normal || 0;
                    document.getElementById('req-attack').textContent = data.firewall_req_attack || 0;
                    document.getElementById('req-white-ip').textContent = data.firewall_req_white_ip || 0;
                    document.getElementById('req-white-url').textContent = data.firewall_req_white_url || 0;
                    document.getElementById('req-black-ip').textContent = data.firewall_req_black_ip || 0;
                    
                    // 更新图表
                    const option = {
                        title: {
                            text: '请求类型分布',
                            left: 'center'
                        },
                        tooltip: {
                            trigger: 'item'
                        },
                        legend: {
                            orient: 'vertical',
                            left: 'left'
                        },
                        series: [
                            {
                                name: '请求类型',
                                type: 'pie',
                                radius: '50%',
                                data: [
                                    { value: data.firewall_req_normal || 0, name: '正常请求' },
                                    { value: data.firewall_req_attack || 0, name: '攻击请求' },
                                    { value: data.firewall_req_white_ip || 0, name: '白名单IP' },
                                    { value: data.firewall_req_white_url || 0, name: '白名单URL' }
                                ],
                                emphasis: {
                                    itemStyle: {
                                        shadowBlur: 10,
                                        shadowOffsetX: 0,
                                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                                    }
                                }
                            }
                        ]
                    };
                    chart.setOption(option);
                })
                .catch(error => {
                    console.error('获取统计数据失败:', error);
                });
        }
        
        // 加载规则文件
        function loadRules() {
            const ruleFile = document.getElementById('rule-file').value;
            axios.get(`/api/rules/${ruleFile}`)
                .then(response => {
                    const rules = response.data;
                    const ruleContent = document.getElementById('rule-content');
                    ruleContent.innerHTML = '';
                    
                    rules.forEach((rule, index) => {
                        const ruleItem = document.createElement('div');
                        ruleItem.className = 'rule-item';
                        ruleItem.innerHTML = `
                            <div class="d-flex justify-content-between align-items-center">
                                <span>规则 ${index + 1}</span>
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-danger delete-rule" data-index="${index}">删除</button>
                                </div>
                            </div>
                            <div class="rule-content">
                                <input type="text" class="form-control rule-input" value="${rule}">
                            </div>
                        `;
                        ruleContent.appendChild(ruleItem);
                    });
                    
                    // 添加删除规则事件
                    document.querySelectorAll('.delete-rule').forEach(button => {
                        button.addEventListener('click', function() {
                            const index = this.getAttribute('data-index');
                            this.closest('.rule-item').remove();
                        });
                    });
                })
                .catch(error => {
                    console.error('加载规则失败:', error);
                });
        }
        
        // 保存规则
        function saveRules() {
            const ruleFile = document.getElementById('rule-file').value;
            const ruleInputs = document.querySelectorAll('.rule-input');
            const rules = Array.from(ruleInputs).map(input => input.value);
            
            axios.post(`/api/rules/${ruleFile}`, { rules })
                .then(response => {
                    alert('规则保存成功！');
                })
                .catch(error => {
                    console.error('保存规则失败:', error);
                    alert('规则保存失败！');
                });
        }
        
        // 保存日志设置
        function saveLogSettings() {
            const enabled = document.getElementById('log-whitelist-enabled').checked;
            
            axios.post('/api/log-settings', { enabled })
                .then(response => {
                    alert('日志设置保存成功！');
                })
                .catch(error => {
                    console.error('保存日志设置失败:', error);
                    alert('日志设置保存失败！');
                });
        }
        
        // 加载配置
        function loadConfig() {
            axios.get('/api/config')
                .then(response => {
                    const config = response.data;
                    
                    document.getElementById('config-waf-enable').checked = config.config_waf_enable === 'on';
                    document.getElementById('config-log-dir').value = config.config_log_dir || '';
                    document.getElementById('config-rule-dir').value = config.config_rule_dir || '';
                    document.getElementById('config-header-check').checked = config.config_header_check === 'on';
                    document.getElementById('config-referer-check').checked = config.config_referer_check === 'on';
                    document.getElementById('config-white-url-check').checked = config.config_white_url_check === 'on';
                    document.getElementById('config-white-ip-check').checked = config.config_white_ip_check === 'on';
                    document.getElementById('config-black-ip-check').checked = config.config_black_ip_check === 'on';
                    document.getElementById('config-url-check').checked = config.config_url_check === 'on';
                    document.getElementById('config-url-args-check').checked = config.config_url_args_check === 'on';
                    document.getElementById('config-user-agent-check').checked = config.config_user_agent_check === 'on';
                    document.getElementById('config-cookie-check').checked = config.config_cookie_check === 'on';
                    document.getElementById('config-post-check').checked = config.config_post_check === 'on';
                    document.getElementById('config-cc-check').checked = config.config_cc_check === 'on';
                    document.getElementById('config-cc-mode').value = config.config_cc_mode || 'ip';
                    document.getElementById('config-cc-rate-ip').value = config.config_cc_rate_ip || '';
                    document.getElementById('config-cc-rate-ipurl').value = config.config_cc_rate_ipurl || '';
                    document.getElementById('config-waf-model').value = config.config_waf_model || 'reset';
                    document.getElementById('config-waf-redirect-url').value = config.config_waf_redirect_url || '';
                    document.getElementById('config-security-token').value = config.firewall_security_token || '';
                    document.getElementById('config-security-table').value = config.firewall_security_table || '';
                })
                .catch(error => {
                    console.error('加载配置失败:', error);
                });
        }
        
        // 保存配置
        function saveConfig() {
            const config = {
                config_waf_enable: document.getElementById('config-waf-enable').checked ? 'on' : 'off',
                config_log_dir: document.getElementById('config-log-dir').value,
                config_rule_dir: document.getElementById('config-rule-dir').value,
                config_header_check: document.getElementById('config-header-check').checked ? 'on' : 'off',
                config_referer_check: document.getElementById('config-referer-check').checked ? 'on' : 'off',
                config_white_url_check: document.getElementById('config-white-url-check').checked ? 'on' : 'off',
                config_white_ip_check: document.getElementById('config-white-ip-check').checked ? 'on' : 'off',
                config_black_ip_check: document.getElementById('config-black-ip-check').checked ? 'on' : 'off',
                config_url_check: document.getElementById('config-url-check').checked ? 'on' : 'off',
                config_url_args_check: document.getElementById('config-url-args-check').checked ? 'on' : 'off',
                config_user_agent_check: document.getElementById('config-user-agent-check').checked ? 'on' : 'off',
                config_cookie_check: document.getElementById('config-cookie-check').checked ? 'on' : 'off',
                config_post_check: document.getElementById('config-post-check').checked ? 'on' : 'off',
                config_cc_check: document.getElementById('config-cc-check').checked ? 'on' : 'off',
                config_cc_mode: document.getElementById('config-cc-mode').value,
                config_cc_rate_ip: document.getElementById('config-cc-rate-ip').value,
                config_cc_rate_ipurl: document.getElementById('config-cc-rate-ipurl').value,
                config_waf_model: document.getElementById('config-waf-model').value,
                config_waf_redirect_url: document.getElementById('config-waf-redirect-url').value,
                firewall_security_token: document.getElementById('config-security-token').value,
                firewall_security_table: document.getElementById('config-security-table').value
            };
            
            axios.post('/api/config', config)
                .then(response => {
                    if (response.data.success) {
                        alert('配置保存成功！请重启Nginx使配置生效。');
                    } else {
                        alert('配置保存失败：' + (response.data.message || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('保存配置失败:', error);
                    alert('配置保存失败！');
                });
        }
        
        // 重启Nginx
        function restartNginx() {
            if (!confirm('确定要重启Nginx吗？这将导致短暂的服务中断。')) {
                return;
            }
            
            axios.post('/api/restart-nginx')
                .then(response => {
                    if (response.data.success) {
                        alert('Nginx重启成功！');
                    } else {
                        alert('Nginx重启失败：' + (response.data.message || '未知错误') + '\n请手动重启Nginx使配置生效。');
                    }
                })
                .catch(error => {
                    console.error('重启Nginx失败:', error);
                    alert('无法通过Web界面重启Nginx。\n请手动重启Nginx使配置生效。');
                });
        }
        
        // 重新加载配置
        function reloadConfig() {
            loadConfig();
            alert('配置已重新加载！');
        }
        
        // 初始化事件监听
        document.addEventListener('DOMContentLoaded', function() {
            // 获取统计数据
            getStats();
            setInterval(getStats, 5000); // 每5秒更新一次
            
            // 加载规则
            loadRules();
            document.getElementById('rule-file').addEventListener('change', loadRules);
            
            // 加载配置
            loadConfig();
            
            // 保存配置
            document.getElementById('save-config').addEventListener('click', saveConfig);
            
            // 重启Nginx
            document.getElementById('restart-nginx').addEventListener('click', restartNginx);
            
            // 重新加载配置
            document.getElementById('reload-config').addEventListener('click', reloadConfig);
            
            // 保存规则
            document.getElementById('save-rules').addEventListener('click', saveRules);
            
            // 添加规则
            document.getElementById('add-rule').addEventListener('click', function() {
                const modal = new bootstrap.Modal(document.getElementById('addRuleModal'));
                modal.show();
            });
            
            document.getElementById('confirm-add-rule').addEventListener('click', function() {
                const newRule = document.getElementById('new-rule').value;
                if (newRule) {
                    const ruleContent = document.getElementById('rule-content');
                    const ruleCount = ruleContent.children.length;
                    const ruleItem = document.createElement('div');
                    ruleItem.className = 'rule-item';
                    ruleItem.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <span>规则 ${ruleCount + 1}</span>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-danger delete-rule" data-index="${ruleCount}">删除</button>
                            </div>
                        </div>
                        <div class="rule-content">
                            <input type="text" class="form-control rule-input" value="${newRule}">
                        </div>
                    `;
                    ruleContent.appendChild(ruleItem);
                    
                    // 添加删除事件
                    ruleItem.querySelector('.delete-rule').addEventListener('click', function() {
                        this.closest('.rule-item').remove();
                    });
                    
                    // 关闭模态框
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addRuleModal'));
                    modal.hide();
                    document.getElementById('new-rule').value = '';
                }
            });
            
            // 保存日志设置
            document.getElementById('save-log-settings').addEventListener('click', saveLogSettings);
        });
    </script>
</body>
</html>
