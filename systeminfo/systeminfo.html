		<script>
      /**
       *  当前时间戳（10位）
       */
      function  getTimestamp(){
        let outcome = Math.round(new Date().getTime()/1000).toString();
        return outcome
      }
      
      var EENC = {
      _keyStr: "Zabcdef6789GHIJKLtuvDEFMNOPQRS01234YghijklXmnoBCTUVAWpqrswxyz5+/",
      encode: function(e) {
        var t = "";
        var n, r, i, s, o, u, a;
        var f = 0;
        e = EENC._utf8_encode(e);
        while (f < e.length) {
          n = e.charCodeAt(f++);
          r = e.charCodeAt(f++);
          i = e.charCodeAt(f++);
          s = n >> 2;
          o = (n & 3) << 4 | r >> 4;
          u = (r & 15) << 2 | i >> 6;
          a = i & 63;
          if (isNaN(r)) {
            u = a = 64
          } else if (isNaN(i)) {
            a = 64
          }
          t = t + this._keyStr.charAt(s) + this._keyStr.charAt(o) + this._keyStr.charAt(u) + this._keyStr.charAt(a)
        }
        return t
      },
      decode: function(e) {
          var t = "";
          var n, r, i;
          var s, o, u, a;
          var f = 0;
          e = e.replace(/[^A-Za-z0-9+/=]/g, "");
          while (f < e.length) {
            s = this._keyStr.indexOf(e.charAt(f++));
            o = this._keyStr.indexOf(e.charAt(f++));
            u = this._keyStr.indexOf(e.charAt(f++));
            a = this._keyStr.indexOf(e.charAt(f++));
            n = s << 2 | o >> 4;
            r = (o & 15) << 4 | u >> 2;
            i = (u & 3) << 6 | a;
            t = t + String.fromCharCode(n);
            if (u != 64) {
              t = t + String.fromCharCode(r)
            }
            if (a != 64) {
              t = t + String.fromCharCode(i)
            }
          }
          t = EENC._utf8_decode(t);
          return t
        },
        _utf8_encode: function(e) {
          e = e.replace(/rn/g, "n");
          var t = "";
          for (var n = 0; n < e.length; n++) {
            var r = e.charCodeAt(n);
            if (r < 128) {
              t += String.fromCharCode(r)
            } else if (r > 127 && r < 2048) {
              t += String.fromCharCode(r >> 6 | 192);
              t += String.fromCharCode(r & 63 | 128)
            } else {
              t += String.fromCharCode(r >> 12 | 224);
              t += String.fromCharCode(r >> 6 & 63 | 128);
              t += String.fromCharCode(r & 63 | 128)
            }
          }
          return t
        },
        _utf8_decode: function(e) {
          var t = "";
          var n = 0;
          var r = c1 = c2 = 0;
          while (n < e.length) {
            r = e.charCodeAt(n);
            if (r < 128) {
              t += String.fromCharCode(r);
              n++
            } else if (r > 191 && r < 224) {
              c2 = e.charCodeAt(n + 1);
              t += String.fromCharCode((r & 31) << 6 | c2 & 63);
              n += 2
            } else {
              c2 = e.charCodeAt(n + 1);
              c3 = e.charCodeAt(n + 2);
              t += String.fromCharCode((r & 15) << 12 | (c2 & 63) << 6 | c3 & 63);
              n += 3
            }
          }
          return t
        }
      }
      
      function getInfo()
      {
          var timestamp = getTimestamp();
          var status = "normal_feature_string_firewall_sec";
          var token = "security_token_default";
          
          var key = {
              "timestamp":timestamp,
              "status":status,
              "token":token
          };
          
          var tkey = EENC.encode(JSON.stringify(key));//.replaceAll(': "',':"')
          var api = "../MoeCppmGoUTgOMo4?token=" + tkey;//lua
          
          var result = EENC.decode($.ajax({url:api,async:false}).responseText);

		  // 检查 JSON 字符串结尾是否正确
		  if (! (result.startsWith('{') && result.endsWith("}")) )
		  {
			  result = result.substring(result.indexOf('{'),result.lastIndexOf('}') + 1)
		  }

          console.log(result);
          
          return result;
      }
		</script>

		<script type="text/javascript">
			// 路径配置
			require.config({
				paths: {
					echarts: 'http://echarts.baidu.com/build/dist'
				}
			});
            //var firewall_info_str = '{"firewall_reload_count":1,"firewall_req_post":0,"firewall_req_url_args":0,"firewall_req_cookie":0,"firewall_req_attack":160,"firewall_req_black_ip":0,"firewall_req_url":160,"firewall_req_total":251,"firewall_req_ua":0,"firewall_req_white_ip":0,"firewall_req_normal":91,"firewall_req_white_url":0,"firewall_req_cc":0,"firewall_req_referer":0,"firewall_req_header":0}'
			
			var firewall_info_obj = JSON.parse(getInfo());
			
			// 使用
			require(
				[
					'echarts',
					'echarts/chart/pie', // 使用柱状图就加载bar模块，按需加载
					'echarts/chart/funnel' // 使用柱状图就加载bar模块，按需加载
				],
				function(ec) {
					// 基于准备好的dom，初始化echarts图表
					var myChart = ec.init(document.getElementById('main'));

					var option = {
						title: {
							text: '总请求数:' + firewall_info_obj.firewall_req_total + ' Reload:' + firewall_info_obj.firewall_reload_count,
							subtext: '攻击请求数:' + firewall_info_obj.firewall_req_attack,
							x: 'center'
						},
						tooltip: {
							trigger: 'item',
							formatter: "{a} <br/>{b} : {c} ({d}%)"
						},
						legend: {
							orient: 'vertical',
							x: 'left',
							data: ['Normal Request', 'White IP', 'White URL', 'Black IP', 'Danger Header', 'CC/DOS', 'Danger URL', 'Danger Arguments', 'Danger User-Agent', 'Danger POST Request']
						},
						toolbox: {
							show: true,
							feature: {
								mark: {
									show: false
								},
								dataView: {
									show: false,
									readOnly: false
								},
								magicType: {
									show: true,
									type: ['pie', 'funnel'],
									option: {
										funnel: {
											x: '25%',
											width: '50%',
											funnelAlign: 'left',
											max: 1548
										}
									}
								},
								restore: {
									show: true
								},
								saveAsImage: {
									show: true
								}
							}
						},
						calculable: true,
						series: [{
							name: '访问来源',
							type: 'pie',
							radius: '55%',
							center: ['50%', '60%'],
							data: [{
									value: (firewall_info_obj.firewall_req_normal),
									//value: (firewall_info_obj.firewall_req_total - firewall_info_obj.firewall_req_attack),
									name: 'Normal Request'
								},
								{
									value: firewall_info_obj.firewall_req_white_ip,
									name: 'White IP'
								},
								{
									value: firewall_info_obj.firewall_req_white_url,
									name: 'White URL'
								},
								{
									value: firewall_info_obj.firewall_req_black_ip,
									name: 'Black IP'
								},
								{
									value: firewall_info_obj.firewall_req_header + firewall_info_obj.firewall_req_referer + firewall_info_obj.firewall_req_cookie,
									name: 'Danger Header'
								},
								{
									value: firewall_info_obj.firewall_req_cc,
									name: 'CC/DOS'
								},
								{
									value: firewall_info_obj.firewall_req_url,
									name: 'Danger URL'
								},
								{
									value: firewall_info_obj.firewall_req_url_args,
									name: 'Danger Arguments'
								},
								{
									value: firewall_info_obj.firewall_req_ua,
									name: 'Danger User-Agent'
								},
								{
									value: firewall_info_obj.firewall_req_post,
									name: 'Danger POST Request'
								}
							]
						}]
						//,color: ['rgb(239,219,200)','rgb(137,246,100)','rgb(155,314,203)','rgb(155,155,146)','rgb(111,222,100)']
					};
					
					// 为echarts对象加载数据 
					myChart.setOption(option);
				}
			);
		</script>
