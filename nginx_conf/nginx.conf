user  nginx;
worker_processes auto;
worker_cpu_affinity auto;

#error_log  logs/error.log;
#error_log  logs/error.log  debug;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  409600;
}

http {
    include       mime.types;
    lua_package_path "/usr/local/openresty/nginx/conf/x-waf/?.lua;/usr/local/lib/lua/?.lua;;";
    lua_shared_dict limit 100m;
    lua_shared_dict badGuys 100m;
    lua_shared_dict system_info 10m; # 供统计信息所用
    default_type  application/octet-stream;

	  #开启lua代码缓存功能
	  lua_code_cache on;

	  init_by_lua_file /usr/local/openresty/nginx/conf/x-waf/init.lua;
    access_by_lua_file /usr/local/openresty/nginx/conf/x-waf/access.lua;

    #log_format shield_access    '$remote_addr - $http_host - "$request" - "$http_cookie"';
    #access_log pipe:/usr/local/shield/redisclient shield_access;
    
    #ssl on;
    #ssl_certificate certs/cert_chain.crt;
    #ssl_certificate_key certs/server.key;
    ssl_session_timeout     5m;
    ssl_protocols SSLv2 SSLv3 TLSv1;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
    ssl_prefer_server_ciphers on;


    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
 
    #gzip  on;
    include vhosts/*.conf;

    server {
        listen       80;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
        	}
        #
        # 获取统计信息接口，时间戳 + 编码
        # 服务端与客户端系统时间差不得超过10分钟，否则不允通过
        #location /MoeCppmGoUTgOMo4 {
        #    default_type text/plain;
        #    content_by_lua 'ngx.say(waf.system_share_info_readall())';
        #	}
        #
        # 获取一个正确 token，仅供测试使用，线上系统不能放开
        # 使用此功能时，需要去掉 init.lua 中 utiltest = require("util") 行的注释。
        #location /Baz1X6pNIuFcXMNo {
        #    default_type text/plain;
        #    content_by_lua 'ngx.say(utiltest.security_test())';
        #	}
        }
}
