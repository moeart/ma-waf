user  nginx;
worker_processes auto;
worker_cpu_affinity auto;

#error_log  logs/error.log;
#error_log  logs/error.log  debug;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  409600;
}

http {
    include       mime.types;
    lua_package_path "D:/BtNginxLua/moewaf/?.lua;;";
    lua_shared_dict limit 100m;
    lua_shared_dict badGuys 100m;
    lua_shared_dict system_info 10m; # 供统计信息所用
    default_type  application/octet-stream;

	#开启lua代码缓存功能
	lua_code_cache on;

	init_by_lua_file D:/BtNginxLua/moewaf/init.lua;
    access_by_lua_file D:/BtNginxLua/moewaf/access.lua;

    #log_format shield_access    '$remote_addr - $http_host - "$request" - "$http_cookie"';
    #access_log pipe:/usr/local/shield/redisclient shield_access;
    
    #ssl on;
    #ssl_certificate certs/cert_chain.crt;
    #ssl_certificate_key certs/server.key;
    ssl_session_timeout     5m;
    ssl_protocols SSLv2 SSLv3 TLSv1;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
    ssl_prefer_server_ciphers on;


    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
 
    #gzip  on;
    include vhosts/*.conf;

    server {
        listen       10086;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   D:/BtNginxLua/moewaf/systeminfo;
            index  index.html index.htm;
        }
        
        # API接口
        location /api/ {
            default_type application/json;
            content_by_lua_file D:/BtNginxLua/moewaf/api.lua;
        }
        
        # 获取统计信息接口
        location /MoeCppmGoUTgOMo4 {
            default_type text/plain;
            content_by_lua 'ngx.say(waf.system_share_info_readall())';
        }
        
        # 获取一个正确 token，仅供测试使用，线上系统不能放开
        location /Baz1X6pNIuFcXMNo {
            default_type text/plain;
            content_by_lua 'ngx.say(require("util").security_test())';
        }
        }
}
